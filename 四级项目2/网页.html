<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!--移动端视口 必须写-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>京东搜索-充电宝</title>
    <style>
        /* 全局重置 学号：24002120422 姓名：刘思媛 无id选择器 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul, li {
            list-style: none;
        }
        a {
            text-decoration: none;
            color: #333;
        }
        img {
            width: 100%;
            display: block;
            border: none;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            font-size: 14px;
            background-color: #f4f4f4;
            padding-bottom: 60px; /*给底部导航留出空间*/
        }
        /* SVG图标通用样式 stu_li_svg 作业iconfont‑svg要求 fill:currentColor，跟随color变色 */
        .stu_li_svg{
            width:1em;
            height:1em;
            fill:currentColor;
            vertical-align: middle;
        }

        .jd-red {
            color: #e6162d;
        }
        .jd-red-bg {
            background-color: #e6162d;
            color:#fff;
        }
        .jd-green-text{
            color:#009e4f;
        }

        /* ========== 1.顶部搜索栏 stu_li_search ========== */
        .stu_li_search{
            width:100%;
            background:#fff;
            padding:12px 14px;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .search-input-box{
            flex:1;
            border:1px solid #ddd;
            border-radius:22px;
            padding:8px 14px;
            display:flex;
            align-items:center;
        }
        .search-input-box input{
            border:none;
            outline:none;
            flex:1;
            font-size:14px;
        }
        .search-camera{
            font-size:20px;
            color:#666;
        }
        .search-icon-more{
            font-size:24px;
            color:#333;
        }

        /* ==========2. 顶部Tab标签：全部、新品、秒送 stu_li_tab ========== */
        .stu_li_tab{
            background:#fff;
            display:flex;
        }
        .tab-item{
            flex:1;
            text-align:center;
            padding:12px 0;
            font-size:16px;
        }
        .tab-item.active{
            color:#e6162d;
            font-weight:bold;
            border-bottom:2px solid #e6162d;
        }

        /* ==========3.热门趋势横向滚动标签 stu_li_hot_tag ========== */
        .stu_li_hot_tag{
            background:#fff;
            padding:14px;
            margin-top:8px;
        }
        .hot-title{
            font-size:15px;
            margin-bottom:10px;
            color:#555;
        }
        .hot-scroll-wrap{
            display:flex;
            gap:16px;
            overflow-x:auto;
            padding-bottom:6px;
        }
        .hot-scroll-wrap::-webkit-scrollbar{
            height:0;
        }
        .hot-item{
            text-align:center;
            flex-shrink:0;
            width:70px;
        }
        .hot-item-img{
            width:50px;
            height:50px;
            border-radius:50%;
            background:#f3f3f3;
            margin:0 auto 6px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            color:#888;
        }

        /* ==========4.筛选标签栏 stu_li_filter ========== */
        .stu_li_filter{
            background:#fff;
            margin:8px 0;
            padding:10px 14px;
            display:flex;
            gap:8px;
            overflow-x:auto;
        }
        .stu_li_filter::-webkit-scrollbar{
            height:0;
        }
        .filter-tag{
            flex-shrink:0;
            border:1px solid #ddd;
            border-radius:16px;
            padding:4px 10px;
            font-size:13px;
        }
        .filter-tag.active{
            border-color:#e6162d;
            color:#e6162d;
        }

        /* ==========5.商品列表容器【双列】 stu_li_goods_wrap ========== */
        .stu_li_goods_wrap{
            padding:0 8px;
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-bottom:20px;
        }
        .stu_li_goods_card{
            width: calc(50% - 5px);
            background:#fff;
            border-radius:8px;
            overflow:hidden;
        }
        .goods-img{
            width:100%;
            height:140px;
            background:#eee;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#aaa;
        }
        .goods-info{
            padding:8px;
        }
        .goods-tip-row{
            display:flex;
            gap:4px;
            flex-wrap:wrap;
            margin-bottom:6px;
        }
        .tip-small{
            font-size:11px;
            padding:2px 4px;
            border-radius:3px;
        }
        .tip-red{
            background:#e6162d;
            color:#fff;
        }
        .tip-green{
            background:#eaf8f0;
            color:#009e4f;
        }
        .goods-title{
            font-size:13px;
            line-height:1.4;
            display: -webkit-box;
            -webkit-line-clamp:2;
            line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
            margin-bottom:8px;
        }
        .goods-price{
            font-size:17px;
            color:#e6162d;
            font-weight:bold;
        }
        .goods-sub-text{
            font-size:12px;
            color:#888;
            margin-top:4px;
        }

        /* ==========底部导航 stu_li_footer_nav（作业要求下导航）========== */
        .stu_li_footer_nav{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:56px;
            background:#fff;
            display:flex;
            border-top:1px solid #eee;
        }
        .footer-nav-item{
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            font-size:12px;
            color:#333;
        }
        .footer-nav-item.active{
            color:#e6162d;
        }
        .footer-nav-item .stu_li_svg{
            width:22px;
            height:22px;
            margin-bottom:2px;
        }
    </style>
</head>

<script>
// JS1：Tab点击切换激活
const tabs = document.querySelectorAll('.tab-item');
tabs.forEach(item=>{
    item.onclick = function(){
        tabs.forEach(t=>t.classList.remove('active'));
        this.classList.add('active');
    }
})

// JS2：商品卡片点击弹窗商品名称
const goodsCards = document.querySelectorAll('.stu_li_goods_card');
goodsCards.forEach(card=>{
    card.onclick = function(){
        const title = this.querySelector('.goods-title').innerText;
        alert("你点击商品："+title);
    }
})

// JS3：底部导航切换激活（作业下导航交互）
const footerItems = document.querySelectorAll('.footer-nav-item');
footerItems.forEach(item=>{
    item.onclick = function(){
        footerItems.forEach(f=>f.classList.remove('active'));
        this.classList.add('active');
    }
})

// JS4：输入框获得焦点背景变色
const searchInput = document.querySelector('.search-input-box input');
searchInput.onfocus = function(){
    this.style.backgroundColor="#f8f8f8";
}
searchInput.onblur = function(){
    this.style.backgroundColor="#fff";
}

// JS5：筛选标签点击切换active
const filterTags = document.querySelectorAll('.filter-tag');
filterTags.forEach(tag=>{
    tag.onclick=function(){
        filterTags.forEach(t=>t.classList.remove('active'));
        this.classList.add('active');
    }
})

// JS6：页面滚动控制台输出滚动距离
window.onscroll=function(){
    console.log("页面滚动Y：",window.scrollY);
}
</script>
